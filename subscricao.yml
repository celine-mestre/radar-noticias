name: Subscricao do relatorio

# Trata um pedido de subscrição ou de cancelamento de ponta a ponta:
# grava o endereço no subscritores.json, envia a confirmação a quem pediu, e
# deixa o registo da alteração no histórico do repositório.
#
# COMO SE USA. Em Actions > Subscricao do relatorio > Run workflow, preencher o
# endereço e as áreas. Os nomes das áreas são tolerantes: aceitam-se sem acentos,
# em minúsculas e parciais — "saude, agricultura" resolve para "Saúde" e
# "Agricultura e Mar". Para todas, escrever "todas".
#
# É a via para os pedidos que chegam por correio. Quem tenha conta no GitHub pode
# correr o fluxo diretamente, sem passar pela unidade.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Endereço de correio eletrónico"
        type: string
        required: true
      areas:
        description: "Áreas, separadas por vírgula, ou 'todas'"
        type: string
        required: true
        default: "todas"
      acao:
        description: "O que fazer"
        type: choice
        required: true
        default: "subscrever"
        options: ["subscrever", "cancelar"]

permissions:
  contents: write

env:
  PAINEL: "https://celine-mestre.github.io/radar-noticias/"

jobs:
  registar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registar a alteracao
        id: registo
        run: |
          set -euo pipefail
          AREAS="${{ inputs.areas }}"
          if [ "${AREAS,,}" = "todas" ]; then
            OPCAO="--todas"
          else
            OPCAO="--areas $AREAS"
          fi
          python gerir_subscritores.py \
            --acao "${{ inputs.acao }}" \
            --email "${{ inputs.email }}" \
            $OPCAO \
            --ficheiro subscritores.json \
            --painel "$PAINEL" \
            --confirmacao-para confirmacao.html \
            --assunto-para assunto.txt
          echo "ASSUNTO=$(cat assunto.txt)" >> "$GITHUB_ENV"

      - name: Gravar no repositorio
        run: |
          set -euo pipefail
          if git diff --quiet subscritores.json; then
            echo "Sem alterações a gravar."
            exit 0
          fi
          git config user.name "Radar de Noticias"
          git config user.email "actions@github.com"
          git add subscritores.json
          git commit -m "${{ inputs.acao }}: ${{ inputs.email }}"
          git push

      - name: Enviar a confirmacao
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          username: ${{ secrets.SMTP_UTILIZADOR }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: ${{ env.ASSUNTO }}
          to: ${{ inputs.email }}
          from: Radar de Noticias <${{ secrets.SMTP_UTILIZADOR }}>
          html_body: file://confirmacao.html
          convert_markdown: false
