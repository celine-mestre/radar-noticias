name: Sintese pelo Amalia

# Escreve, por cada área governativa e por cada origem de imprensa — Portugal,
# lusofonia e internacional —, um parágrafo com o que foi notícia no período.
# Corre o Amália no próprio servidor do fluxo de trabalho: o modelo tem pesos
# abertos sob licença Apache 2.0 e não depende de qualquer serviço externo.
#
# PORQUE CORRE EM PARALELO. Sem placa gráfica, um parágrafo demora vários
# minutos, e uma área com notícias nas três origens passa dos vinte. Dezasseis
# áreas em sequência levariam horas e não caberiam na janela da manhã. Cada área
# corre, por isso, no seu próprio trabalho, e um passo final junta os resultados
# num só ficheiro. O tempo total passa a ser o da área mais demorada.
#
# CALENDÁRIO. 08h22 UTC — 09h22 em Lisboa —, entre a recolha das 09h07 e o envio
# dos relatórios das 10h17, para que a síntese e a lista digam respeito ao mesmo
# momento.

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Janela a sintetizar"
        type: choice
        default: "auto"
        options: ["auto", "24h", "48h", "72h"]
      apenas:
        description: "Ensaio: uma ou mais áreas, por vírgula (vazio = todas)"
        type: string
        required: false
        default: ""
      gravar:
        description: "Gravar o ensaio, para o relatório o poder usar"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "22 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sintese-amalia
  cancel-in-progress: false

jobs:
  # Uma área por trabalho. O GitHub corre até vinte em simultâneo em
  # repositórios públicos, pelo que as dezasseis arrancam todas ao mesmo tempo.
  sintetizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        area:
          - "Negócios Estrangeiros"
          - "Finanças"
          - "Presidência"
          - "Reforma do Estado"
          - "Assuntos Parlamentares"
          - "Defesa Nacional"
          - "Administração Interna"
          - "Justiça"
          - "Economia e Coesão Territorial"
          - "Infraestruturas e Habitação"
          - "Educação, Ciência e Inovação"
          - "Saúde"
          - "Trabalho, Solidariedade e Segurança Social"
          - "Cultura, Juventude e Desporto"
          - "Ambiente e Energia"
          - "Agricultura e Mar"
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      # Um ensaio de áreas escolhidas salta as restantes, sem as correr
      - name: Verificar se esta area entra
        id: entra
        run: |
          APENAS="${{ inputs.apenas }}"
          if [ -z "$APENAS" ]; then
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          elif echo "$APENAS" | grep -qi "$(echo '${{ matrix.area }}' | cut -c1-6)"; then
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          else
            echo "correr=nao" >> "$GITHUB_OUTPUT"
            echo "Fora do ensaio pedido."
          fi

      - name: Preparar o Python
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do modelo
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: amalia-9b-q4km-v1

      - name: Instalar dependencias
        if: steps.entra.outputs.correr == 'sim'
        run: |
          python -m pip install --upgrade pip
          # Pacote já compilado para processador: compilar no servidor demoraria
          # dez a quinze minutos e pode falhar por falta de dependências.
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install huggingface-hub

      - name: Gerar a sintese desta area
        if: steps.entra.outputs.correr == 'sim'
        run: |
          PERIODO="${{ github.event.inputs.periodo }}"
          if [ -z "$PERIODO" ]; then PERIODO="auto"; fi
          mkdir -p partes
          NOME=$(echo '${{ matrix.area }}' | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          python sintese_ia.py --local --dados arquivo.json \
            --periodo "$PERIODO" --apenas "${{ matrix.area }}" \
            --saida "partes/$NOME.json"

      - name: Guardar a parte
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: sintese-${{ strategy.job-index }}
          path: partes/
          retention-days: 1
          if-no-files-found: ignore

  # Junta as partes e grava. Corre mesmo que alguma área tenha falhado: mais vale
  # um ficheiro com quinze áreas do que nenhum.
  juntar:
    needs: sintetizar
    if: always() && (inputs.apenas == '' || inputs.gravar)
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obter as partes
        uses: actions/download-artifact@v4
        with:
          pattern: sintese-*
          path: recebidas
          merge-multiple: true

      - name: Juntar num so ficheiro
        run: |
          set -euo pipefail
          if [ -z "$(ls -A recebidas 2>/dev/null)" ]; then
            echo "::warning::Nenhuma área produziu síntese. Nada a gravar."
            exit 0
          fi
          python sintese_ia.py --juntar recebidas --saida sinteses.json

      - name: Gravar no repositorio
        run: |
          set -euo pipefail
          if [ ! -f sinteses.json ]; then
            echo "Sem sínteses a gravar."
            exit 0
          fi
          git config user.name "Radar de Noticias"
          git config user.email "actions@github.com"
          git add sinteses.json
          if git diff --cached --quiet; then
            echo "Sem alterações a gravar."
            exit 0
          fi
          git commit -m "sínteses do Amália"
          git pull --rebase --autostash
          git push
