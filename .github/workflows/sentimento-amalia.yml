name: Sentimento pelo Amalia

# Classifica o tom (positivo, neutro, negativo) das noticias da comunicacao
# social nacional, de forma incremental: cada execucao trata apenas o que ainda
# nao tem avaliacao. Corre a seguir a CADA recolha, e nao uma vez por dia: como
# so trata o que falta, as recolhas sem novidade suficiente nem chegam a
# carregar o modelo. Grava sentimentos.json e sentimento-serie.json.
#
# EM VALIDACAO. As avaliacoes automaticas aparecem nos paineis com esse rotulo
# enquanto a leitura humana de verificacao nao estiver concluida.

on:
  workflow_dispatch:
    inputs:
      teto:
        description: "Noticias a classificar, no maximo"
        type: string
        required: false
        default: "600"
      recuperar:
        description: "Dias antigos a repescar do arquivo mensal (AAAA-MM-DD, por virgulas)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      encadeado:
        type: boolean
        required: false
        default: false
      teto:
        type: string
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: gravacao-repositorio-sentimento
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.v.outputs.seguir }}
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar o minimo para decidir
        run: pip install --quiet openpyxl

      - name: Ha noticias por avaliar?
        id: v
        run: |
          if [ "${{ inputs.encadeado }}" != "true" ]; then
            echo "Execucao manual: segue sempre."
            echo "seguir=sim" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # O criterio e o trabalho pendente, nao a hora nem o dia: assim o
          # sentimento corre a seguir a QUALQUER recolha e as noticias ficam
          # classificadas poucas horas depois de publicadas, em vez de so na
          # manha seguinte. Como e incremental, nas recolhas sem novidade nao
          # ha nada a fazer e o modelo de 5,6 GB nem chega a ser carregado.
          # O minimo evita acordar o modelo para meia duzia de noticias.
          python3 - <<'PY'
          import json, os, importlib.util

          MINIMO = 15

          def modulo(nome):
              spec = importlib.util.spec_from_file_location(nome, f"{nome}.py")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          try:
              sent = modulo("sentimento_ia")
              recolha, _ = sent.modulos_do_repositorio()
              with open("arquivo.json", encoding="utf-8") as f:
                  noticias = json.load(f).get("noticias", [])
              avaliadas = {}
              if os.path.exists("sentimentos.json"):
                  with open("sentimentos.json", encoding="utf-8") as f:
                      avaliadas = json.load(f).get("avaliacoes", {})
              faltam = sent.pendentes(noticias, avaliadas,
                                      recolha.origem_da_fonte, 8)
              decisao = "sim" if len(faltam) >= MINIMO else "nao"
              nota = (f"{len(faltam)} por avaliar (minimo {MINIMO}), "
                      f"{len(avaliadas)} ja feitas")
          except Exception as erro:
              # Na duvida, corre: perde-se tempo de maquina, nao dados.
              decisao = "sim"
              nota = f"verificacao falhou ({type(erro).__name__}), segue"

          # Só a linha «nome=valor» entra no ficheiro de resultados: o GitHub
          # rejeita o ficheiro inteiro se lá encontrar outra coisa. As notas
          # para quem lê o registo vão para o ecrã, como é devido.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as saida:
              saida.write(f"seguir={decisao}\n")
          print(nota)
          PY

  classificar:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet llama-cpp-python huggingface-hub openpyxl

      - name: Guardar o modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: amalia-gguf

      - name: Classificar
        run: |
          python sentimento_ia.py --local \
            --teto "${{ inputs.teto || '600' }}" \
            --recuperar "${{ inputs.recuperar || '' }}"

      - name: Gravar as avaliacoes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # A recolha de 2 em 2 horas tambem faz commits: o push do sentimento
          # pode colidir com um commit entretanto chegado. Tenta-se ate 5 vezes,
          # buscando sempre o mais recente antes de reenviar, para nao perder as
          # avaliacoes por causa de uma colisao de gravacao.
          for tentativa in 1 2 3 4 5; do
            git add sentimentos.json sentimento-serie.json sentimento-meses 2>/dev/null || true
            git diff --cached --quiet && { echo "Nada a gravar."; break; }
            git commit -m "Sentimento das noticias" || true
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; }
            if git push origin HEAD:main; then
              echo "Gravado na tentativa $tentativa."
              break
            fi
            echo "Colisao na tentativa $tentativa; a repetir..."
            sleep 5
          done
