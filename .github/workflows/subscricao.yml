name: Subscricao do relatorio

# Trata um pedido de subscrição ou de cancelamento de ponta a ponta:
# grava o endereço no subscritores.json, envia a confirmação a quem pediu, e
# deixa o registo da alteração no histórico do repositório.
#
# COMO SE USA. Em Actions > Subscricao do relatorio > Run workflow, preencher o
# endereço e as áreas. Os nomes das áreas são tolerantes: aceitam-se sem acentos,
# em minúsculas e parciais — "saude, agricultura" resolve para "Saúde" e
# "Agricultura e Mar". Para todas, escrever "todas".
#
# É a via para os pedidos que chegam por correio. Quem tenha conta no GitHub pode
# correr o fluxo diretamente, sem passar pela unidade.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Endereço de correio eletrónico"
        type: string
        required: true
      areas:
        description: "Áreas, separadas por vírgula, ou 'todas'"
        type: string
        required: true
        default: "todas"
      acao:
        description: "O que fazer"
        type: choice
        required: true
        default: "subscrever"
        options: ["subscrever", "cancelar"]

permissions:
  contents: write

env:
  PAINEL: "https://celine-mestre.github.io/radar-noticias/"

jobs:
  registar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registar a alteracao
        id: registo
        run: |
          set -euo pipefail
          AREAS="${{ inputs.areas }}"

          # As áreas têm espaços no nome — "Agricultura e Mar" — pelo que o valor
          # tem de seguir entre aspas. Sem isso, cada palavra era lida como um
          # argumento separado e o comando falhava.
          if [ "${AREAS,,}" = "todas" ]; then
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" \
              --email "${{ inputs.email }}" \
              --todas \
              --ficheiro subscritores.json \
              --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --assunto-para assunto.txt
          else
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" \
              --email "${{ inputs.email }}" \
              --areas "$AREAS" \
              --ficheiro subscritores.json \
              --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --assunto-para assunto.txt
          fi
          echo "ASSUNTO=$(cat assunto.txt)" >> "$GITHUB_ENV"

      - name: Gravar no repositorio
        run: |
          set -euo pipefail
          if git diff --quiet subscritores.json; then
            echo "Sem alterações a gravar."
            exit 0
          fi
          git config user.name "Radar de Noticias"
          git config user.email "actions@github.com"
          git add subscritores.json
          git commit -m "${{ inputs.acao }}: ${{ inputs.email }}"
          # Três fluxos gravam no mesmo repositório e podem cruzar-se: puxa-se
          # primeiro o que houver, para o envio não ser recusado.
          git pull --rebase --autostash
          git push

      # O envio só é tentado se as credenciais estiverem configuradas. Sem elas,
      # o registo faz-se na mesma e o passo é ignorado em vez de dar erro.
      - name: Verificar as credenciais
        id: correio
        run: |
          if [ -n "${{ secrets.SMTP_SERVIDOR }}" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem credenciais de correio configuradas. O registo foi gravado; a confirmação não é enviada."
          fi

      # A confirmação fica sempre disponível para descarregar, mesmo quando não é
      # enviada: permite ver exatamente o que o subscritor receberá.
      - name: Guardar a confirmacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmacao
          path: |
            confirmacao.html
            confirmacao.txt
          retention-days: 14

      - name: Enviar a confirmacao
        if: steps.correio.outputs.pronto == 'sim'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          username: ${{ secrets.SMTP_UTILIZADOR }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: ${{ env.ASSUNTO }}
          to: ${{ inputs.email }}
          from: Radar de Noticias <${{ secrets.SMTP_UTILIZADOR }}>
          # As duas versões seguem juntas: o cliente de correio apresenta a que
          # sabe ler, e a mensagem nunca fica ilegível.
          html_body: file://confirmacao.html
          body: file://confirmacao.txt
          convert_markdown: false
