name: Subscricao do relatorio

# Trata um pedido de subscrição ou de cancelamento de ponta a ponta: atualiza a
# lista de destinatários, envia a confirmação a quem pediu, e não deixa qualquer
# endereço visível no repositório.
#
# ONDE FICAM OS DESTINATÁRIOS. Num segredo do repositório chamado SUBSCRITORES,
# com o conteúdo em JSON:
#
#   {"areas": {"Saúde": ["nome@sggoverno.gov.pt"], "Justiça": []}}
#
# Segredos não são legíveis por quem consulte o repositório, nem aparecem nos
# registos das execuções — o GitHub oculta-os automaticamente.
#
# ATUALIZAÇÃO AUTOMÁTICA. Para o fluxo poder gravar no segredo é preciso um
# segundo segredo, SUBSCRITORES_PAT, com um token de acesso pessoal de âmbito
# restrito: apenas este repositório, e apenas a permissão "Secrets: read and
# write". Sem esse token o fluxo corre na mesma e deixa a lista atualizada em
# Artifacts, para se colar à mão no segredo.
#
# COMO SE USA. Em Actions > Subscricao do relatorio > Run workflow, preencher o
# endereço e as áreas. Os nomes das áreas aceitam-se sem acentos, em minúsculas
# e parciais. Para todas, escrever "todas".

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Endereço de correio eletrónico"
        type: string
        required: true
      areas:
        description: "Áreas, separadas por vírgula, ou 'todas'"
        type: string
        required: true
        default: "todas"
      acao:
        description: "O que fazer"
        type: choice
        required: true
        default: "subscrever"
        options: ["subscrever", "cancelar"]

permissions:
  contents: read

env:
  PAINEL: "https://celine-mestre.github.io/radar-noticias/"

jobs:
  registar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registar a alteracao
        env:
          SUBSCRITORES: ${{ secrets.SUBSCRITORES }}
        run: |
          set -euo pipefail
          AREAS="${{ inputs.areas }}"

          # As áreas têm espaços no nome — "Agricultura e Mar" — pelo que o valor
          # tem de seguir entre aspas.
          if [ "${AREAS,,}" = "todas" ]; then
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" --email "${{ inputs.email }}" --todas \
              --gravar-em subscritores_novo.json --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --texto-para confirmacao.txt \
              --assunto-para assunto.txt
          else
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" --email "${{ inputs.email }}" --areas "$AREAS" \
              --gravar-em subscritores_novo.json --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --texto-para confirmacao.txt \
              --assunto-para assunto.txt
          fi
          echo "ASSUNTO=$(cat assunto.txt)" >> "$GITHUB_ENV"

      - name: Gravar a lista no segredo
        if: ${{ secrets.SUBSCRITORES_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.SUBSCRITORES_PAT }}
        run: |
          set -euo pipefail
          gh secret set SUBSCRITORES --repo "${{ github.repository }}" \
            --body "$(cat subscritores_novo.json)"
          echo "Lista atualizada no segredo SUBSCRITORES."

      - name: Guardar a lista para atualizacao manual
        if: ${{ secrets.SUBSCRITORES_PAT == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: subscritores-atualizado
          path: subscritores_novo.json
          retention-days: 7

      - name: Verificar as credenciais
        id: correio
        run: |
          if [ -n "${{ secrets.SMTP_SERVIDOR }}" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem credenciais de correio. A confirmação não é enviada."
          fi

      - name: Guardar a confirmacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmacao
          path: |
            confirmacao.html
            confirmacao.txt
          retention-days: 14

      - name: Enviar a confirmacao
        if: steps.correio.outputs.pronto == 'sim'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: false
          username: ${{ secrets.SMTP_UTILIZADOR }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: ${{ env.ASSUNTO }}
          to: ${{ inputs.email }}
          from: Radar de Noticias <${{ secrets.SMTP_UTILIZADOR }}>
          html_body: file://confirmacao.html
          body: file://confirmacao.txt
          convert_markdown: false
