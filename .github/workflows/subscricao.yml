name: Subscricao do relatorio

# Trata um pedido de subscrição ou de cancelamento de ponta a ponta: atualiza a
# lista de destinatários, envia a confirmação a quem pediu, e não deixa qualquer
# endereço visível no repositório.
#
# ONDE FICAM OS DESTINATÁRIOS. Num segredo do repositório chamado SUBSCRITORES,
# com o conteúdo em JSON:
#
#   {"areas": {"Saúde": ["nome@sggoverno.gov.pt"], "Justiça": []}}
#
# Segredos não são legíveis por quem consulte o repositório, nem aparecem nos
# registos das execuções — o GitHub oculta-os automaticamente.
#
# ATUALIZAÇÃO AUTOMÁTICA. Para o fluxo poder gravar no segredo é preciso um
# segundo segredo, SUBSCRITORES_PAT, com um token de acesso pessoal de âmbito
# restrito: apenas este repositório, e apenas a permissão "Secrets: read and
# write". Sem esse token o fluxo corre na mesma e deixa a lista atualizada em
# Artifacts, para se colar à mão no segredo.
#
# COMO SE USA. Em Actions > Subscricao do relatorio > Run workflow, preencher o
# endereço e as áreas. Os nomes das áreas aceitam-se sem acentos, em minúsculas
# e parciais. Para todas, escrever "todas".

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        required: true
        default: "subscrever"
        options: ["subscrever", "cancelar", "listar"]
      email:
        description: "Endereço (deixar vazio para listar)"
        type: string
        required: false
        default: ""
      areas:
        description: "Áreas, separadas por vírgula, ou 'todas'"
        type: string
        required: false
        default: "todas"

permissions:
  contents: read

# Um de cada vez a gravar no segredo dos subscritores
concurrency:
  group: gravacao-repositorio
  cancel-in-progress: false

env:
  PAINEL: "https://celine-mestre.github.io/radar-noticias/"

jobs:
  registar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A listagem mostra quantos subscritores tem cada área e os endereços
      # parcialmente ocultos: os registos das execuções são públicos.
      - name: Listar os subscritores
        if: inputs.acao == 'listar'
        env:
          SUBSCRITORES: ${{ secrets.SUBSCRITORES }}
        run: python gerir_subscritores.py --acao listar

      - name: Registar a alteracao
        if: inputs.acao != 'listar'
        env:
          SUBSCRITORES: ${{ secrets.SUBSCRITORES }}
        run: |
          set -euo pipefail
          AREAS="${{ inputs.areas }}"

          # As áreas têm espaços no nome — "Agricultura e Mar" — pelo que o valor
          # tem de seguir entre aspas.
          if [ "${AREAS,,}" = "todas" ]; then
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" --email "${{ inputs.email }}" --todas \
              --gravar-em subscritores_novo.json --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --texto-para confirmacao.txt \
              --assunto-para assunto.txt
          else
            python gerir_subscritores.py \
              --acao "${{ inputs.acao }}" --email "${{ inputs.email }}" --areas "$AREAS" \
              --gravar-em subscritores_novo.json --painel "$PAINEL" \
              --confirmacao-para confirmacao.html \
              --texto-para confirmacao.txt \
              --assunto-para assunto.txt
          fi
          echo "ASSUNTO=$(cat assunto.txt)" >> "$GITHUB_ENV"

      # Toda a lógica dentro do comando: nos blocos "if" o acesso aos segredos
      # depende do nível em que estão declarados, e foi aí que isto falhou duas
      # vezes. Dentro de um "run" os segredos são sempre legíveis.
      - name: Gravar a lista no segredo
        if: inputs.acao != 'listar'
        env:
          GH_TOKEN: ${{ secrets.SUBSCRITORES_PAT }}
        run: |
          set -uo pipefail
          if [ ! -f subscritores_novo.json ]; then
            echo "::error::A lista atualizada não foi produzida."
            exit 1
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta o segredo SUBSCRITORES_PAT: a lista NÃO foi gravada."
            echo "A alteração não é publicada por outra via — a lista contém"
            echo "endereços de terceiros e este repositório é público."
            echo "Crie o token e volte a correr."
            exit 1
          fi

          echo "Token presente. A gravar no segredo SUBSCRITORES…"
          if gh secret set SUBSCRITORES --repo "${{ github.repository }}" \
               --body "$(cat subscritores_novo.json)"; then
            echo "Lista gravada. As alterações valem a partir da próxima execução."
          else
            echo "::error::A gravação falhou. Verifique se o token tem a permissão"
            echo "'Secrets: Read and write' sobre este repositório."
            exit 1
          fi

      - name: Verificar as credenciais
        id: correio
        if: inputs.acao != 'listar'
        run: |
          if [ -n "${{ secrets.SMTP_SERVIDOR }}" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem credenciais de correio. A confirmação não é enviada."
          fi

      - name: Enviar a confirmacao
        if: steps.correio.outputs.pronto == 'sim'
        # Sem continue-on-error: uma falha de envio tem de ficar visível. Antes,
        # o fluxo ficava verde mesmo quando a mensagem não saía.
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: false
          username: ${{ secrets.SMTP_UTILIZADOR }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: ${{ env.ASSUNTO }}
          to: ${{ inputs.email }}
          from: Radar de Noticias <${{ secrets.SMTP_UTILIZADOR }}>
          html_body: file://confirmacao.html
          body: file://confirmacao.txt
          convert_markdown: false

      - name: Resultado
        if: always() && inputs.acao != 'listar'
        run: |
          if [ "${{ steps.correio.outputs.pronto }}" != "sim" ]; then
            echo "::warning::Credenciais de correio em falta: a confirmação não foi enviada."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Confirmação enviada."
          else
            echo "::error::O envio falhou. Veja o passo 'Enviar a confirmacao'."
          fi
