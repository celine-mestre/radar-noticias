name: Resumo dos picos pelo Amalia

# Para cada pico noticioso registado no alertas.json, pede ao Amalia um resumo
# do que o motivou, a partir das noticias reais desse dia e area (do arquivo
# mensal integral). Incremental: so resume picos que ainda nao tem resumo.
# Grava picos-resumos.json, que o painel de evolucao le.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      encadeado:
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: gravacao-repositorio-picos
  cancel-in-progress: false

jobs:
  # Passo leve, sem modelo: há algum pico ainda sem resumo? Se não houver,
  # nada disto precisa de correr — poupa descarregar 5,6 GB a cada recolha.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.v.outputs.seguir }}
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ha picos por resumir?
        id: v
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          picos = []
          if os.path.exists("alertas.json"):
              with open("alertas.json", encoding="utf-8") as f:
                  picos = json.load(f).get("historico", [])
          feitos = {}
          if os.path.exists("picos-resumos.json"):
              with open("picos-resumos.json", encoding="utf-8") as f:
                  feitos = json.load(f).get("resumos", {})
          faltam = [p for p in picos
                    if f"{p.get('data')}|{p.get('area')}" not in feitos]
          print(f"seguir={'sim' if faltam else 'nao'}")
          print(f"# {len(faltam)} picos por resumir, {len(feitos)} ja feitos")
          PY

  resumir:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet llama-cpp-python huggingface-hub openpyxl

      - name: Guardar o modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: amalia-gguf

      - name: Resumir os picos
        run: python resumo_picos.py --local

      - name: Gravar os resumos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Como noutros fluxos do Amalia, o push pode colidir com um commit da
          # recolha de 2 em 2 horas. Tenta-se ate 5 vezes, buscando o mais
          # recente antes de reenviar, para nao perder os resumos.
          for tentativa in 1 2 3 4 5; do
            git add picos-resumos.json 2>/dev/null || true
            git diff --cached --quiet && { echo "Nada a gravar."; break; }
            git commit -m "Resumo dos picos noticiosos" || true
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "Gravado na tentativa $tentativa."
              break
            fi
            echo "Colisao na tentativa $tentativa; a repetir..."
            sleep 5
          done
