name: Radar de Noticias

on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_noticias.py"
      - ".github/workflows/radar-noticias.yml"
  schedule:
    # Todos os dias, incluindo fim de semana: sem isso, o arquivo ficaria com um
    # buraco de dois dias e a segunda-feira perderia o que aconteceu ao sábado.
    # De duas em duas horas, das 06h07 às 18h07 UTC — 07h07 às 19h07 em Lisboa,
    # no horário de verão. Assim quem consulta o painel a meio da tarde vê o que
    # foi noticiado nessa tarde, e não a manhã.
    #
    # Os minutos estão deslocados de propósito: às horas certas o GitHub tem
    # picos de procura e as execuções agendadas são atrasadas ou saltadas.
    - cron: "7 6-18/2 * * *"
    # E uma última às 23h07 de Lisboa, para fechar o dia: o que for publicado ao
    # serão entraria de outro modo já depois de a série do dia estar escrita.
    - cron: "7 22 * * *"

permissions:
  contents: write

# Três fluxos gravam no mesmo repositório. Sem isto, duas execuções simultâneas
# podiam recusar-se mutuamente o envio.
concurrency:
  group: gravacao-repositorio
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet openpyxl

      - name: Recolher as noticias
        run: |
          NOME="radar_noticias_$(date +%Y%m%d).xlsx"
          echo "NOME=$NOME" >> "$GITHUB_ENV"
          python extrair_noticias.py --periodo 24h --saida "$NOME" \
            --json noticias.json --historico historico.json \
            --arquivo arquivo.json --dias-arquivo 7 --mensal meses \
            --corpus corpus.json --fontes

      - name: Fechar os dias ja passados
        # O dia D so esta completo depois da primeira recolha de D+1: a das
        # 23h07 nao apanha o que sair entre as 23h07 e as 23h59. Este passo
        # reconta todos os dias anteriores a hoje a partir do arquivo mensal,
        # que e a unica fonte que reflete sempre as expressoes em vigor.
        run: |
          python reconstruir_series.py \
            || echo "::warning::O fecho dos dias falhou; a serie fica como estava."
        continue-on-error: true

      - name: Avaliar os alertas de tempestade politica
        # Corre depois da recolha, sobre o arquivo mensal ja atualizado. Uma
        # falha aqui nao pode derrubar a recolha: os alertas sao acessorios.
        run: python alertas.py --mensal meses --saida alertas.json || true

      - name: Gravar os ficheiros de dados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Só se acrescenta o que existe: um ficheiro opcional em falta fazia
          # o "git add" falhar e derrubava a recolha inteira.
          for f in noticias.json historico.json arquivo.json corpus.json alertas.json \
                   sentimento-serie.json publicacoes.json fontes-recolha.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -d meses ]; then git add meses/; fi
          if [ -d sentimento-meses ]; then git add sentimento-meses/; fi
          git diff --cached --quiet || git commit -m "Recolha de noticias"
          # Três fluxos gravam no mesmo repositório e podem cruzar-se: puxa-se
          # primeiro o que houver, para o envio não ser recusado. Nos ficheiros
          # de dados, reescritos por inteiro a cada recolha, um rebase simples
          # entra em conflito — a opção -X theirs resolve-o ficando com a
          # versão desta recolha, que é a mais fresca. E porque outro fluxo
          # pode gravar exatamente entre o puxar e o enviar, tenta-se até três
          # vezes; um rebase que ainda assim encalhe é abortado antes de repetir.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash -X theirs || { git rebase --abort 2>/dev/null || true; }
            if git push; then break; fi
            if [ "$tentativa" = "3" ]; then echo "Gravação falhou após 3 tentativas."; exit 1; fi
            sleep $((tentativa * 10))
          done

      - name: Disponibilizar o Excel do dia
        uses: actions/upload-artifact@v4
        with:
          name: radar-noticias
          path: ${{ env.NOME }}
          retention-days: 30

  # ── O CIRCUITO ─────────────────────────────────────────────────────────────
  # A síntese e o relatório são chamados aqui, dentro desta mesma execução, e
  # não por um gatilho entre fluxos. Assim não dependem de o GitHub registar um
  # agendamento nem um evento: terminando a recolha, correm de certeza.
  #
  # Cada um verifica, ao arrancar, se é a recolha certa do dia — salta a das
  # 07h07 e desiste se o trabalho já estiver feito.
  sintese:
    needs: recolher
    uses: ./.github/workflows/sintese-amalia.yml
    with:
      periodo: "auto"
      encadeado: true
      # Origens a sintetizar. Vazio inclui Portugal, lusofonia e internacional.
      # Escrever "nacionais" limita a síntese à imprensa portuguesa — é a saída
      # se os parágrafos das outras origens não convencerem.
      origens: ""
    secrets: inherit

  # O sentimento corre em paralelo com a síntese: nenhum depende do outro,
  # e ambos verificam por si se o trabalho do dia já está feito.
  sentimento:
    needs: recolher
    uses: ./.github/workflows/sentimento-amalia.yml
    with:
      encadeado: true
    secrets: inherit

  # O resumo dos picos explica, com o Amália, o que motivou cada pico do dia.
  # Depende dos alertas, que a recolha grava — daí correr depois dela. É
  # incremental: só resume picos que ainda não tenham resumo, pelo que correr
  # a cada recolha custa quase nada nos dias sem picos novos.
  resumo_picos:
    needs: recolher
    uses: ./.github/workflows/resumo-picos.yml
    with:
      encadeado: true
    secrets: inherit

  # Corre mesmo que a síntese falhe: o relatório sai sem o parágrafo, que é
  # acessório. As notícias é que não podem faltar.
  relatorio:
    needs: [recolher, sintese]
    if: always() && needs.recolher.result == 'success'
    uses: ./.github/workflows/relatorio-diario.yml
    with:
      periodo: "auto"
      encadeado: true
    secrets: inherit
