name: Radar de Noticias

on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_noticias.py"
      - ".github/workflows/radar-noticias.yml"
  schedule:
    - cron: "0 6 * * 1-5"     # cedo, para o painel estar pronto
    - cron: "0 8 * * 1-5"     # recolha da manhã, antes da síntese e do relatório

permissions:
  contents: write

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet openpyxl

      - name: Recolher as noticias
        run: |
          NOME="radar_noticias_$(date +%Y%m%d).xlsx"
          echo "NOME=$NOME" >> "$GITHUB_ENV"
          python extrair_noticias.py --periodo 24h --saida "$NOME" \
            --json noticias.json --historico historico.json \
            --arquivo arquivo.json --dias-arquivo 7 --fontes

      - name: Gravar os ficheiros de dados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add noticias.json historico.json arquivo.json
          git diff --cached --quiet || git commit -m "Recolha de noticias"
          # Três fluxos gravam no mesmo repositório e podem cruzar-se: puxa-se
          # primeiro o que houver, para o envio não ser recusado.
          git pull --rebase --autostash
          git push

      - name: Disponibilizar o Excel do dia
        uses: actions/upload-artifact@v4
        with:
          name: radar-noticias
          path: ${{ env.NOME }}
          retention-days: 30
