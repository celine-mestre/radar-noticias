name: Sintese pelo Amalia

# Escreve, por cada área governativa e por cada origem de imprensa — Portugal,
# lusofonia e internacional —, um parágrafo com o que foi notícia no período.
# Corre o Amália no próprio servidor do fluxo de trabalho: o modelo tem pesos
# abertos sob licença Apache 2.0 e não depende de qualquer serviço externo.
#
# PORQUE CORRE EM PARALELO. Sem placa gráfica, um parágrafo demora vários
# minutos, e uma área com notícias nas três origens passa dos vinte. Dezasseis
# áreas em sequência levariam horas e não caberiam na janela da manhã. Cada área
# corre, por isso, no seu próprio trabalho, e um passo final junta os resultados
# num só ficheiro. O tempo total passa a ser o da área mais demorada.
#
# QUANDO CORRE. Não por relógio próprio, mas **a seguir à recolha da manhã**. Os
# três fluxos — recolha, síntese e relatório — formam um circuito encadeado: cada
# um arranca quando o anterior termina. Com horários independentes, bastava a
# recolha atrasar-se para a síntese trabalhar sobre notícias da véspera.
#
# O gatilho é a conclusão do fluxo "Radar de Noticias", que corre sete vezes por
# dia. A síntese faz-se UMA VEZ por dia útil, e na recolha certa: salta a das
# 07h07, por ser cedo de mais — a imprensa ainda mal publicou —, e trata a das
# 09h07. Falhando essa, qualquer recolha posterior do mesmo dia serve.
#
# A verificação é "já se fez hoje?" e não "que horas são?". Assim há margem para
# atrasos, o dia nunca sai duplicado, e o circuito pode ser ensaiado a qualquer
# momento correndo a recolha à mão.

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Janela a sintetizar"
        type: choice
        default: "auto"
        options: ["auto", "24h", "48h", "72h"]
      apenas:
        description: "Ensaio: uma ou mais áreas, por vírgula (vazio = todas)"
        type: string
        required: false
        default: ""
      gravar:
        description: "Gravar o ensaio, para o relatório o poder usar"
        type: boolean
        required: false
        default: false
      origens:
        description: "Origens a sintetizar (vazio = as três)"
        type: choice
        required: false
        default: ""
        options: ["", "nacionais", "nacionais,lusofonas"]
  # Chamado pelo fluxo da recolha, logo a seguir a ela. Não se usa workflow_run:
  # esse gatilho depende de o GitHub o registar e não disparou de forma fiável.
  # Sendo chamado, corre dentro da mesma execução e não pode deixar de correr.
  workflow_call:
    inputs:
      periodo:
        type: string
        required: false
        default: "auto"
      apenas:
        type: string
        required: false
        default: ""
      gravar:
        type: boolean
        required: false
        default: true
      origens:
        description: "Origens a sintetizar. Vazio inclui Portugal, lusofonia e internacional"
        type: string
        required: false
        default: ""
      encadeado:
        description: "Chamado pela recolha: aplica as verificações do dia"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: sintese-amalia
  cancel-in-progress: false

jobs:
  # Só a recolha da manhã tem seguimento. As outras seis do dia servem o painel e
  # não geram síntese nem relatório.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.v.outputs.seguir }}
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        # A execução está presa ao commit que a iniciou. Sem pedir o ramo, este
        # passo receberia o repositório como estava ANTES de a recolha gravar o
        # arquivo — e a síntese e o relatório trabalhariam sobre a véspera.
        with:
          ref: main

      - name: Verificar se ja ha sintese de hoje
        id: v
        run: |
          if [ "${{ inputs.encadeado }}" != "true" ]; then
            echo "Execução manual: segue sempre."
            echo "seguir=sim" >> "$GITHUB_OUTPUT"; exit 0
          fi

          DIA=$(date -u +%u)
          if [ "$DIA" -gt 5 ]; then
            echo "Fim de semana: não há síntese nem relatório."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A primeira recolha do dia, às 07h07 de Lisboa, é cedo de mais: a
          # imprensa ainda mal publicou e o relatório sairia com a véspera.
          # Espera-se pela das 09h07. Falhando essa, qualquer recolha posterior
          # do mesmo dia serve — o que dá margem sem fixar uma hora rígida.
          # A janela é a da manhã. A recolha das 07h07 é cedo de mais, e a das
          # 23h07 — que existe para fechar o dia — não deve gerar relatórios a
          # meio da noite.
          HORA=$(date -u +%H)
          if [ "$HORA" -gt 12 ]; then
            echo "Recolha do fim do dia: não gera síntese nem relatório."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HORA" -lt 8 ]; then
            echo "Recolha das 07h07: cedo de mais para a síntese do dia."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi

          HOJE=$(TZ=Europe/Lisbon date +%Y-%m-%d)
          FEITA=""
          if [ -f sinteses.json ]; then
            FEITA=$(python -c "import json;print(json.load(open('sinteses.json',encoding='utf-8')).get('gerado','')[:10])" 2>/dev/null || echo "")
          fi
          echo "Hoje: $HOJE · síntese existente: ${FEITA:-nenhuma}"

          if [ "$FEITA" = "$HOJE" ]; then
            echo "Já há síntese de hoje: esta recolha não gera outra."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"
          else
            echo "Primeira recolha do dia com síntese por fazer: segue."
            echo "seguir=sim" >> "$GITHUB_OUTPUT"
          fi

  # Uma área por trabalho. O GitHub corre até vinte em simultâneo em
  # repositórios públicos, pelo que as dezasseis arrancam todas ao mesmo tempo.
  sintetizar:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        area:
          - "Primeiro-Ministro"
          - "Negócios Estrangeiros"
          - "Finanças"
          - "Presidência"
          - "Reforma do Estado"
          - "Assuntos Parlamentares"
          - "Defesa Nacional"
          - "Administração Interna"
          - "Justiça"
          - "Economia e Coesão Territorial"
          - "Infraestruturas e Habitação"
          - "Educação, Ciência e Inovação"
          - "Saúde"
          - "Trabalho, Solidariedade e Segurança Social"
          - "Cultura, Juventude e Desporto"
          - "Ambiente e Energia"
          - "Agricultura e Mar"
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        # A execução está presa ao commit que a iniciou. Sem pedir o ramo, este
        # passo receberia o repositório como estava ANTES de a recolha gravar o
        # arquivo — e a síntese e o relatório trabalhariam sobre a véspera.
        with:
          ref: main

      # Um ensaio de áreas escolhidas salta as restantes, sem as correr
      - name: Verificar se esta area entra
        id: entra
        run: |
          APENAS="${{ inputs.apenas }}"
          if [ -z "$APENAS" ]; then
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          elif echo "$APENAS" | grep -qi "$(echo '${{ matrix.area }}' | cut -c1-6)"; then
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          else
            echo "correr=nao" >> "$GITHUB_OUTPUT"
            echo "Fora do ensaio pedido."
          fi

      - name: Preparar o Python
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do modelo
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: amalia-9b-q4km-v1

      - name: Instalar dependencias
        if: steps.entra.outputs.correr == 'sim'
        run: |
          python -m pip install --upgrade pip
          # Pacote já compilado para processador: compilar no servidor demoraria
          # dez a quinze minutos e pode falhar por falta de dependências.
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install huggingface-hub

      - name: Gerar a sintese desta area
        if: steps.entra.outputs.correr == 'sim'
        run: |
          PERIODO="${{ inputs.periodo }}"
          if [ -z "$PERIODO" ]; then PERIODO="auto"; fi
          mkdir -p partes
          NOME=$(echo '${{ matrix.area }}' | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          python sintese_ia.py --local --dados arquivo.json \
            --periodo "$PERIODO" --apenas "${{ matrix.area }}" \
            --origens "${{ inputs.origens }}" \
            --saida "partes/$NOME.json"

      - name: Guardar a parte
        if: steps.entra.outputs.correr == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: sintese-${{ strategy.job-index }}
          path: partes/
          retention-days: 1
          if-no-files-found: ignore

  # Junta as partes e grava. Corre mesmo que alguma área tenha falhado: mais vale
  # um ficheiro com quinze áreas do que nenhum.
  juntar:
    needs: [decidir, sintetizar]
    if: always() && needs.decidir.outputs.seguir == 'sim' && (inputs.apenas == '' || inputs.gravar)
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        # A execução está presa ao commit que a iniciou. Sem pedir o ramo, este
        # passo receberia o repositório como estava ANTES de a recolha gravar o
        # arquivo — e a síntese e o relatório trabalhariam sobre a véspera.
        with:
          ref: main

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obter as partes
        uses: actions/download-artifact@v4
        with:
          pattern: sintese-*
          path: recebidas
          merge-multiple: true

      - name: Juntar num so ficheiro
        run: |
          set -euo pipefail
          if [ -z "$(ls -A recebidas 2>/dev/null)" ]; then
            echo "::warning::Nenhuma área produziu síntese. Nada a gravar."
            exit 0
          fi
          python sintese_ia.py --juntar recebidas --saida sinteses.json

      - name: Gravar no repositorio
        run: |
          set -euo pipefail
          if [ ! -f sinteses.json ]; then
            echo "Sem sínteses a gravar."
            exit 0
          fi
          git config user.name "Radar de Noticias"
          git config user.email "actions@github.com"
          git add sinteses.json
          if git diff --cached --quiet; then
            echo "Sem alterações a gravar."
            exit 0
          fi
          git commit -m "sínteses do Amália"
          git pull --rebase --autostash
          git push
