name: Radar de Noticias

on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_noticias.py"
      - ".github/workflows/radar-noticias.yml"
  schedule:
    # Todos os dias, incluindo fim de semana: sem isso, o arquivo ficaria com um
    # buraco de dois dias e a segunda-feira perderia o que aconteceu ao sábado.
    # De duas em duas horas, das 06h07 às 18h07 UTC — 07h07 às 19h07 em Lisboa,
    # no horário de verão. Assim quem consulta o painel a meio da tarde vê o que
    # foi noticiado nessa tarde, e não a manhã.
    #
    # Os minutos estão deslocados de propósito: às horas certas o GitHub tem
    # picos de procura e as execuções agendadas são atrasadas ou saltadas.
    - cron: "7 6-18/2 * * *"

permissions:
  contents: write

# Três fluxos gravam no mesmo repositório. Sem isto, duas execuções simultâneas
# podiam recusar-se mutuamente o envio.
concurrency:
  group: gravacao-repositorio
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet openpyxl

      - name: Recolher as noticias
        run: |
          NOME="radar_noticias_$(date +%Y%m%d).xlsx"
          echo "NOME=$NOME" >> "$GITHUB_ENV"
          python extrair_noticias.py --periodo 24h --saida "$NOME" \
            --json noticias.json --historico historico.json \
            --arquivo arquivo.json --dias-arquivo 7 --mensal meses \
            --corpus corpus.json --fontes

      - name: Gravar os ficheiros de dados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Só se acrescenta o que existe: um ficheiro opcional em falta fazia
          # o "git add" falhar e derrubava a recolha inteira.
          for f in noticias.json historico.json arquivo.json corpus.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d meses ] && git add meses/
          git diff --cached --quiet || git commit -m "Recolha de noticias"
          # Três fluxos gravam no mesmo repositório e podem cruzar-se: puxa-se
          # primeiro o que houver, para o envio não ser recusado.
          git pull --rebase --autostash
          git push

      - name: Disponibilizar o Excel do dia
        uses: actions/upload-artifact@v4
        with:
          name: radar-noticias
          path: ${{ env.NOME }}
          retention-days: 30
